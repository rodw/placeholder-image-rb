version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # The stand-alone container's pinned base image (docker/Dockerfile).
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly

  # The stand-alone container's locked gems (docker/Gemfile.lock).
  - package-ecosystem: bundler
    directory: "/docker"
    schedule:
      interval: weekly
    groups:
      docker-gems:
        patterns:
          - "*"
